# CI: runs on every push and PR. Render production deploys are gated on
# these checks passing (render.yaml: autoDeployTrigger: checksPass).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -count=1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  security:
    name: Vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: govulncheck (Go dependencies + stdlib)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (fail on high/critical)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          docker compose up -d db backend frontend
          # Wait for backend health and the Vite dev server.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && break
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/health
      - name: Run Playwright suite
        run: |
          docker run --rm --network host \
            -v "$PWD/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright:v1.49.1-noble \
            sh -c "npm ci && npx playwright test"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs backend frontend --tail 100
