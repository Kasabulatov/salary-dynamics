# Daily data refresh.
#
# Step 1 asks the backend to ingest exchange rates + inflation (free backend
# tiers spin down, so no in-process cron — spec §3.4).
#
# Step 2 fills news headlines for ⚡ events via Google News RSS search
# (keyless, supports historical after:/before: operators). The fetch runs
# HERE rather than in the backend because news providers throttle fixed
# cloud egress IPs (GDELT 429'd both Render and GitHub runners; Google News
# tolerates this workflow's one small burst per day). Results are posted
# back through a secret-protected endpoint and cached forever.
#
# Secrets required: BACKEND_URL, REFRESH_SECRET.
name: Refresh exchange rates

on:
  schedule:
    - cron: "30 6 * * *" # daily at 06:30 UTC, after most central banks publish
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh rates and inflation
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.BACKEND_URL }}/api/internal/refresh" \
            -H "X-Refresh-Secret: ${{ secrets.REFRESH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Fill news headlines via Google News
        run: |
          set -euo pipefail
          URL="${{ secrets.BACKEND_URL }}"
          AUTH="X-Refresh-Secret: ${{ secrets.REFRESH_SECRET }}"

          PENDING=$(curl --fail-with-body -sS "$URL/api/internal/news/pending?limit=15" -H "$AUTH")
          COUNT=$(echo "$PENDING" | jq '.items | length')
          echo "events awaiting news: $COUNT"
          if [ "$COUNT" -eq 0 ]; then exit 0; fi

          RESULTS='[]'
          for i in $(seq 0 $((COUNT - 1))); do
            ITEM=$(echo "$PENDING" | jq ".items[$i]")
            ID=$(echo "$ITEM" | jq '.id')
            TERMS=$(echo "$ITEM" | jq -r '.terms')
            START=$(echo "$ITEM" | jq -r '.start')
            END=$(echo "$ITEM" | jq -r '.end')
            # GDELT-style datetimes -> Google News date operators (before: exclusive).
            AFTER="${START:0:4}-${START:4:2}-${START:6:2}"
            BEFORE=$(date -d "${END:0:4}-${END:4:2}-${END:6:2} +1 day" +%F)

            sleep 2 # polite pacing
            Q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" \
              "$TERMS after:$AFTER before:$BEFORE")
            ART=$(curl -sS -m 20 \
              "https://news.google.com/rss/search?q=$Q&hl=en-US&gl=US&ceid=US:en" \
              -H "User-Agent: Mozilla/5.0 (compatible; salary-dynamics/1.0)" \
              | python3 -c '
          import sys, json, xml.etree.ElementTree as ET
          # Prefer the first article whose title mentions the search terms
          # (currency/country) — avoids caching loosely related stories.
          terms = [w.lower() for w in sys.argv[1].split()]
          try:
              root = ET.fromstring(sys.stdin.read())
              items = root.findall(".//item")
              best = None
              for it in items:
                  title = (it.findtext("title") or "").lower()
                  if any(w in title for w in terms):
                      best = it
                      break
              if best is None and items:
                  best = items[0]
              if best is None:
                  print(json.dumps({"title": "", "link": ""}))
              else:
                  print(json.dumps({
                      "title": (best.findtext("title") or "").strip()[:300],
                      "link": (best.findtext("link") or "").strip()[:2000],
                  }))
          except Exception:
              print(json.dumps({"error": True}))
          ' "$TERMS" || echo '{"error": true}')

            if echo "$ART" | jq -e '.error // false' | grep -q true; then
              # Parse/network failure: leave NULL so tomorrow's run retries.
              echo "event $ID: fetch failed — skipping"
            else
              TITLE=$(echo "$ART" | jq -r '.title')
              LINK=$(echo "$ART" | jq -r '.link')
              echo "event $ID ($(echo "$ITEM" | jq -r '.pair')): ${TITLE:-no coverage}"
              RESULTS=$(echo "$RESULTS" | jq --argjson id "$ID" \
                --arg t "$TITLE" --arg u "$LINK" '. + [{id: $id, headline: $t, url: $u}]')
            fi
          done

          echo "$RESULTS" | jq '{items: .}' | curl --fail-with-body -sS -X POST \
            "$URL/api/internal/news" -H "$AUTH" -H "Content-Type: application/json" -d @-
