# Render Blueprint — creates the backend service from this repo.
# In Render: New + -> Blueprint -> pick this repo. It reads this file.
services:
  - type: web
    name: salary-dynamics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # same region as the Neon database
    autoDeployTrigger: checksPass # deploy only after GitHub CI is green
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # paste the Neon connection string when prompted
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      # Dashboard-managed (like DATABASE_URL): set to the real Vercel URL in
      # Render's Environment tab. MUST be sync:false — a hardcoded value here
      # gets re-synced to the blueprint on every deploy, silently reverting
      # the real origin and breaking CORS ("Failed to fetch" on the site).
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE # Vercel <-> Render is cross-site: None + Secure required
        value: "none"
