name: salary-dynamics

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dynamics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dynamics_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dynamics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynamics} -d ${POSTGRES_DB:-dynamics}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    command: go run .
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dynamics}:${POSTGRES_PASSWORD:-dynamics_local_pw}@db:5432/${POSTGRES_DB:-dynamics}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev_refresh_secret_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
  node_modules:
